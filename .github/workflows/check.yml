name: Check

on:
  schedule:
    # Every 15 minutes (GitHub may start scheduled runs a few minutes late)
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # save the database to the "state" branch
  pages: write      # publish the dashboard
  id-token: write
  actions: write    # keep the schedule from being auto-disabled

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore state
        run: |
          mkdir -p data
          if git fetch --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:bugbark.db > data/bugbark.db
          else
            echo "No saved state yet (first run)"
          fi

      - name: Run checks
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}  # searching GitHub for public exploit code
          BUGBARK_PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 -m bugbark --config config.toml --data data --due --export site

      - name: Save state
        if: always()
        run: |
          [ -f data/bugbark.db ] || exit 0
          cd data
          git init -q -b state
          git add bugbark.db
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "State $(date -u +%FT%TZ)"
          # GitHub sometimes rejects a push with a transient server error: retry before failing the run
          for i in 1 2 3; do
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state && exit 0
            sleep 10
          done
          exit 1

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
        env:
          # Pages skips a deployment whose version (the commit) it already has, and the code rarely changes
          # between runs, so give every run its own version
          GITHUB_SHA: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/check.yml/enable" || true
